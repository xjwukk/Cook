services:
  cook:
    build:
      context: .
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL-http://localhost:8080}
    ports:
      - '${COOK_HOST:-127.0.0.1}:${COOK_PORT:-8080}:80'
    depends_on:
      - cook-server
    restart: unless-stopped

  cook-server:
    build:
      context: ./server
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      COOK_DB_PATH: /data/cook.sqlite
    volumes:
      - cook-data:/data
    restart: unless-stopped

volumes:
  cook-data:
