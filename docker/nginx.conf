server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative when TLS or the public port belongs to a proxy.
    absolute_redirect off;

    # 收藏和历史整份上传，留出比服务端 8 MB 略大的余量。
    client_max_body_size 10m;

    # 字体 CSS 与 woff2 都是文本/字体资源，gzip 后体积明显更小。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # A stale asset URL must return 404, never the SPA entry point.
    # Hash 化的 _nuxt 资源可以长期缓存。
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 字体：切片文件名暂时不带内容哈希，先用 30 天 + 必须重新验证。
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # 账号与同步接口交给 cook-server；不缓存，并保留原始 Host 与协议。
    location /api/ {
        proxy_pass http://cook-server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # index.html 不缓存，保证新版本发布后能立即拿到新的资源清单。
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
