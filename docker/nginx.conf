server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative when TLS or the public port belongs to a proxy.
    absolute_redirect off;

    # 收藏和历史整份上传，留出比服务端 8 MB 略大的余量。
    client_max_body_size 10m;

    # A stale asset URL must return 404, never the SPA entry point.
    location /_nuxt/ {
        try_files $uri =404;
    }

    # 账号与同步接口交给 cook-server；不缓存，并保留原始 Host 与协议。
    location /api/ {
        proxy_pass http://cook-server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
